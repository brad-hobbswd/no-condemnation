<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 | No Condemnation</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:
linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.62)),
url('banner.jpg') center/cover no-repeat;
padding:40px 24px;
font-family:'Inter',sans-serif;
overflow:hidden;
}

.error-box{
max-width:760px;
text-align:center;
color:#fff;
}

.error-code{
font-family:'Newsreader',serif;
font-size:clamp(5rem,14vw,10rem);
line-height:1;
margin-bottom:24px;
color:#f3ece2;
}

.error-title{
font-family:'Newsreader',serif;
font-size:clamp(2.5rem,6vw,4.5rem);
font-weight:500;
line-height:1.1;
margin-bottom:28px;
color:#fff;
}

.error-text{
font-size:1.05rem;
line-height:2;
color:#ece3d7;
max-width:620px;
margin:auto;
margin-bottom:42px;
}

.scripture{
font-family:'Newsreader',serif;
font-size:clamp(1.5rem,4vw,2.4rem);
font-style:italic;
line-height:1.6;
color:#f3ece2;
margin-bottom:18px;
}

.scripture-reference{
letter-spacing:4px;
text-transform:uppercase;
font-size:.8rem;
color:#d7b47a;
margin-bottom:50px;
}

.home-button{
display:inline-block;
padding:16px 34px;
background:#f3ece2;
color:#1f1b18;
text-decoration:none;
border-radius:100px;
font-size:.88rem;
letter-spacing:2px;
text-transform:uppercase;
transition:.35s ease;
}

.home-button:hover{
transform:translateY(-4px);
background:#fff;
}

</style>
</head>

<body>

<div class="error-box">

<div class="error-code">
404
</div>

<h1 class="error-title">
The page could not be found.
</h1>

<p class="error-text">
Some paths unexpectedly disappear. Grace still remains steady and unchanged through Jesus Christ.
</p>

<div class="scripture">
“There is therefore now no condemnation to them which are in Christ Jesus.”
</div>

<div class="scripture-reference">
Romans 8:1
</div>

<a href="index.html" class="home-button">
Return Home
</a>

</div>

</body>
</html>
